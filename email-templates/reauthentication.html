<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 0;">
  <div style="background: #1F4D3A; border-radius: 18px; overflow: hidden;">
    <div style="padding: 36px 36px 0;">
      <div style="display: inline-block; background: #ffffff; border-radius: 12px; padding: 10px 16px; margin-bottom: 32px;">
        <img src="https://lounge.venneir.com/lounge-logo.png" alt="Lounge" style="height: 22px; width: auto; display: block;" />
      </div>
      <h1 style="color: #ffffff; font-size: 22px; font-weight: 700; margin: 0 0 8px; line-height: 1.3;">Verification code</h1>
      <p style="color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; margin: 0 0 24px;">Enter this code to verify your identity and continue.</p>
      <div style="background: rgba(0,0,0,0.2); border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; text-align: center;">
        <span style="color: #ffffff; font-size: 32px; font-weight: 800; letter-spacing: 0.12em; font-variant-numeric: tabular-nums;">{{ .Token }}</span>
      </div>
      <p style="color: rgba(255,255,255,0.4); font-size: 13px; line-height: 1.5; margin: 0 0 36px; text-align: center;">This code expires in 10 minutes and can only be used once.</p>
    </div>
    <div style="padding: 20px 36px 28px; border-top: 1px solid rgba(255,255,255,0.08);">
      <p style="color: rgba(255,255,255,0.4); font-size: 12px; line-height: 1.6; margin: 0;">If you did not request this code, please change your password immediately.</p>
    </div>
  </div>
  <p style="color: rgba(14,20,20,0.35); font-size: 11px; text-align: center; margin: 20px 0 0; line-height: 1.5;">Venneir Ltd. Coatbridge, Scotland</p>
</div>
