<div style="background: #F7F6F2; padding: 32px 16px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="max-width: 480px; margin: 0 auto;">
    <div style="background: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 12px rgba(14,20,20,0.05), 0 1px 2px rgba(14,20,20,0.04);">
      <div style="height: 6px; background: #E8F5EC;"></div>
      <div style="padding: 40px 36px 32px;">
        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 900; color: #0E1414; letter-spacing: -0.045em; line-height: 1; margin: 0 0 32px;">lounge</div>
        <h1 style="color: #0E1414; font-size: 24px; font-weight: 700; margin: 0 0 8px; line-height: 1.3; letter-spacing: -0.01em;">Verification code</h1>
        <p style="color: rgba(14,20,20,0.6); font-size: 15px; line-height: 1.6; margin: 0 0 24px;">Enter this code to verify your identity and continue.</p>
        <div style="background: #E8F5EC; border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; text-align: center;">
          <span style="color: #1F4D3A; font-size: 32px; font-weight: 700; letter-spacing: 0.12em; font-variant-numeric: tabular-nums;">{{ .Token }}</span>
        </div>
        <p style="color: rgba(14,20,20,0.5); font-size: 13px; line-height: 1.5; margin: 0; text-align: center;">This code expires in 10 minutes and can only be used once.</p>
      </div>
      <div style="padding: 20px 36px 28px; background: #F7F6F2; border-top: 1px solid rgba(14,20,20,0.06);">
        <p style="color: rgba(14,20,20,0.5); font-size: 12px; line-height: 1.6; margin: 0;">If you did not request this code, please change your password immediately.</p>
      </div>
    </div>
  </div>
</div>
