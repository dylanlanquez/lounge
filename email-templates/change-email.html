<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 0;">
  <div style="background: #1F4D3A; border-radius: 18px; overflow: hidden;">
    <div style="padding: 36px 36px 0;">
      <div style="display: inline-block; background: #ffffff; border-radius: 12px; padding: 10px 16px; margin-bottom: 32px;">
        <img src="https://lounge.venneir.com/lounge-logo.png" alt="Lounge" style="height: 22px; width: auto; display: block;" />
      </div>
      <h1 style="color: #ffffff; font-size: 22px; font-weight: 700; margin: 0 0 8px; line-height: 1.3;">Confirm your new email</h1>
      <p style="color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; margin: 0 0 28px;">You requested to change your email address. Tap the button below to confirm this change.</p>
      <a href="{{ .ConfirmationURL }}" style="display: block; background: #ffffff; color: #0E1414; text-align: center; padding: 14px 24px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 36px;">Confirm new email</a>
    </div>
    <div style="padding: 20px 36px 28px; border-top: 1px solid rgba(255,255,255,0.08);">
      <p style="color: rgba(255,255,255,0.4); font-size: 12px; line-height: 1.6; margin: 0;">If you did not request this change, please contact your administrator immediately.</p>
    </div>
  </div>
  <p style="color: rgba(14,20,20,0.35); font-size: 11px; text-align: center; margin: 20px 0 0; line-height: 1.5;">Venneir Ltd. Coatbridge, Scotland</p>
</div>
