<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon URLs carry a ?v= cache buster. Vercel's CDN, browsers,
      and iOS Add-to-Home-Screen all cache these aggressively by URL.
      Bump the version whenever the icon art changes. Every icon is
      rendered from the vector mark (logos/lounge-favicon.ai) at its
      own size, never scaled up from a bitmap.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=6" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=6" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=6" />
    <link rel="icon" href="/favicon.ico?v=6" sizes="any" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=6" color="#000000" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png?v=6" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=6" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=6" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512x512.png?v=6" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/apple-touch-icon-1024x1024.png?v=6" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/mstile-150x150.png?v=6" />
    <meta name="msapplication-config" content="/browserconfig.xml?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lounge" />
    <meta name="application-name" content="Lounge" />
    <meta name="description" content="Walk-ins and appointments by Venneir." />
    <!--
      Open Graph / Twitter card. Without these, Vercel's deployment
      previews and link-share unfurls fall back to a generic Vercel
      thumbnail. og-image.png is a 1200x630 card (the L mark and the
      lounge wordmark) for iMessage, Slack and the Vercel dashboard.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lounge" />
    <meta property="og:description" content="Walk-ins and appointments by Venneir." />
    <meta property="og:image" content="https://lounge.venneir.com/og-image.png?v=6" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lounge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lounge" />
    <meta name="twitter:description" content="Walk-ins and appointments by Venneir." />
    <meta name="twitter:image" content="https://lounge.venneir.com/og-image.png?v=6" />
    <title>Lounge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
