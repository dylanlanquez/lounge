# Supabase project config for the Lounge edge functions.
#
# Per-function overrides only. The platform defaults
# (verify_jwt = true for every function) are correct for everything
# else; we list exceptions here so the CLI's deploy step picks them
# up without needing a one-off `--no-verify-jwt` flag each time.
#
# send-appointment-confirmation
#   The receiver of the widget-create / widget-reschedule /
#   widget-cancel email-invoke chain. Function-to-function calls
#   from those three widgets carry the project's service-role
#   secret in a custom `X-Lng-Internal-Token` header (compared
#   against the receiver's own SUPABASE_SERVICE_ROLE_KEY env var),
#   and that's the actual auth boundary. The platform's
#   `verify_jwt = true` was rejecting these calls with
#   `UNAUTHORIZED_INVALID_JWT_FORMAT` because the platform-injected
#   SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY env vars on
#   this project are opaque `sb_publishable_* / sb_secret_*`
#   tokens (post key-system migration), not JWTs — so no Bearer
#   value the caller could compose would pass the format check.
#   Turning verify_jwt off here means the function's own auth
#   (custom internal-token header for widget callers, user JWT
#   getUser() check for staff callers) is the sole gate. Same
#   effective security, just no redundant platform-level filter
#   that's now broken on the new key model.
[functions.send-appointment-confirmation]
verify_jwt = false

# meet-attendance-sweep
#   Cron-driven sweep that pulls Google Meet attendance for every
#   recently-ended virtual appointment. Called every 5 minutes from
#   pg_cron via lng_run_meet_attendance_sweep, using the service-role
#   key out of vault.lng_service_role_key as the Bearer credential.
#   Same key-system mismatch as send-appointment-confirmation: the
#   service-role token is an opaque `sb_secret_*` value (not a JWT),
#   so the platform's `verify_jwt = true` rejects it with
#   `UNAUTHORIZED_INVALID_JWT_FORMAT`. The function's own auth
#   (decoded-bearer role + project-ref check OR x-cron-secret header)
#   is the actual gate.
[functions.meet-attendance-sweep]
verify_jwt = false

# twilio-sms-status
#   Public delivery-status webhook Twilio POSTs to on every SMS state
#   change (queued -> sent -> delivered / failed). Twilio sends no
#   Authorization header, so the platform's `verify_jwt = true`
#   rejects every callback with 401 and the row stays stuck on
#   'pending' forever (the "Sending..." panel never resolves). The
#   function's own auth is the gate: the unguessable project subdomain
#   in the URL plus a twilio_message_sid lookup (it only ever updates
#   rows we already created), and an optional X-Twilio-Signature check
#   when TWILIO_AUTH_TOKEN is set. This was deployed with
#   --no-verify-jwt originally; pinning it here stops a plain redeploy
#   silently reverting it to true (which is what broke delivery status).
[functions.twilio-sms-status]
verify_jwt = false
